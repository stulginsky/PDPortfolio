name: Validate publication release

on:
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  release-validation:
    name: release-validation
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - name: Detect image-only replacements
        id: scope
        shell: bash
        run: |
          python3 - <<'PY'
          import json, os, re, subprocess
          from pathlib import Path

          def git(*args):
              return subprocess.check_output(['git', *args], text=True)

          def changes(base, head, ignored):
              fields = git('diff', '--no-renames', '--name-status', '-z', base, head).split('\0')
              return {(status, path) for status, path in zip(fields[::2], fields[1::2]) if path not in ignored}

          if os.environ['GITHUB_EVENT_NAME'] == 'pull_request':
              old = json.loads(git('show', 'HEAD^1:.release-source.json'))['sourceCommit']
              new = json.loads(git('show', 'HEAD:.release-source.json'))['sourceCommit']
              manifest = 'app/generated/public-asset-revisions.ts'
              source = changes(old, new, {manifest})
              release = changes('HEAD^1', 'HEAD', {manifest, '.release-source.json'})
              pattern = r'(?:public|app/assets)/.+\.(?:svg|png|apng|jpe?g|webp|gif|avif|ico|bmp)'
              if source and source == release and all(status == 'M' and re.fullmatch(pattern, path, re.I) for status, path in source):
                  with open(os.environ['GITHUB_OUTPUT'], 'a') as output:
                      print('images_only=true', file=output)
                  Path(os.environ['RUNNER_TEMP'], 'publication-images.json').write_text(
                      json.dumps(sorted(path for _, path in source)))
          PY
      - uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: npm
      - name: Reject development-only files
        run: node scripts/check-release-tree.mjs
      - run: npm ci
      - run: npm run generate
        env:
          NUXT_APP_BASE_URL: /PDPortfolio/
      - run: npm run check:static
        env:
          NUXT_APP_BASE_URL: /PDPortfolio/
      - uses: ./.github/actions/build-storybook
        with:
          site-base: /PDPortfolio/
      - run: npx playwright install --with-deps chromium
      - run: npm run check:storybook
        if: steps.scope.outputs.images_only != 'true'
        env:
          NUXT_APP_BASE_URL: /PDPortfolio/
      - name: Check replaced graphics
        if: steps.scope.outputs.images_only == 'true'
        shell: bash
        run: |
          python3 - <<'PY'
          import json, os
          from pathlib import Path
          import xml.etree.ElementTree as ET
          for name in json.loads(Path(os.environ['RUNNER_TEMP'], 'publication-images.json').read_text()):
              image = Path(name)
              if image.suffix.lower() == '.svg':
                  assert ET.parse(image).getroot().tag == '{http://www.w3.org/2000/svg}svg', name
          PY
          mkdir -p "$RUNNER_TEMP/portfolio"
          ln -s "$PWD/.output/public" "$RUNNER_TEMP/portfolio/PDPortfolio"
          python3 -m http.server 4173 --bind 127.0.0.1 --directory "$RUNNER_TEMP/portfolio" &
          server=$!
          trap 'kill "$server"' EXIT
          curl --retry 5 --retry-connrefused --silent --fail http://127.0.0.1:4173/PDPortfolio/ > /dev/null
          node --input-type=module <<'JS'
          import assert from 'node:assert/strict'
          import { readFile } from 'node:fs/promises'
          import path from 'node:path'
          import { chromium } from 'playwright'
          const files = JSON.parse(await readFile(path.join(process.env.RUNNER_TEMP, 'publication-images.json'), 'utf8'))
          const mime = { svg: 'svg+xml', jpg: 'jpeg', jpeg: 'jpeg', ico: 'x-icon' }
          const base = 'http://127.0.0.1:4173/PDPortfolio/'
          const browser = await chromium.launch()
          try {
            const page = await browser.newPage()
            for (const file of files) {
              const bytes = await readFile(file)
              const extension = path.extname(file).slice(1).toLowerCase()
              let url = `data:image/${mime[extension] ?? extension};base64,${bytes.toString('base64')}`
              if (file.startsWith('public/')) {
                url = base + file.slice('public/'.length).split('/').map(encodeURIComponent).join('/')
                const response = await page.request.get(url)
                assert.equal(response.status(), 200, file)
                assert((await response.body()).equals(bytes), `Published bytes differ: ${file}`)
              }
              await page.evaluate(async src => {
                const image = new Image()
                image.src = src
                await image.decode()
              }, url).catch(error => { throw new Error(`Cannot decode ${file}`, { cause: error }) })
              console.log(`Verified ${file}`)
            }
          } finally {
            await browser.close()
          }
          JS
      - name: Identify validated tree
        id: publication
        run: echo "tree=$(git rev-parse HEAD^{tree})" >> "$GITHUB_OUTPUT"
      - uses: actions/upload-pages-artifact@v4
        with:
          name: publication-${{ steps.publication.outputs.tree }}
          path: .output/public
          retention-days: 14
