name: Validate publication release

on:
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  release-validation:
    name: release-validation
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: npm
      - name: Reject development-only files
        run: node scripts/check-release-tree.mjs
      - run: npm ci
      - run: npm run generate
        env:
          NUXT_APP_BASE_URL: /PDPortfolio/
      - run: npm run check:static
        env:
          NUXT_APP_BASE_URL: /PDPortfolio/
      - uses: ./.github/actions/build-storybook
        with:
          site-base: /PDPortfolio/
      - run: npx playwright install --with-deps chromium
      - run: npm run check:storybook
        env:
          NUXT_APP_BASE_URL: /PDPortfolio/
